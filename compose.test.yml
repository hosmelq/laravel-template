services:
  postgresql:
    environment:
      POSTGRES_DB: template_testing
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    healthcheck:
      interval: 1s
      retries: 30
      start_period: 30s
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d template_testing']
      timeout: 5s
    image: postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    ports:
      - '127.0.0.1:0:5432'
    tmpfs:
      - /var/lib/postgresql
