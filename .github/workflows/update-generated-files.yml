name: Update generated files

on:
  pull_request:
    paths:
      - '.railway/package.json'
      - 'package.json'
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}

permissions: {}

env:
  NODE_VERSION: '26.10.0'
  NUB_VERSION: '0.9.5'
  PHP_VERSION: '8.5'

jobs:
  update-nub-lock:
    name: Update Nub lockfiles

    if: github.event_name == 'pull_request' && github.event.pull_request.user.id == 29139614 && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      actions: write # Run CI for the lockfile commit.
      contents: write # Commit the lockfiles to the dependency branch.

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          nub-version: ${{ env.NUB_VERSION }}

      - name: Update Nub lockfiles
        run: |
          for directory in . .railway; do
            if [ -f "${directory}/package.json" ]; then
              nub --cwd "${directory}" install --ignore-scripts --lockfile-only --no-frozen-lockfile
            fi
          done

      - name: Commit Nub lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add --all -- '*nub.lock'

          if git diff --cached --quiet; then
            exit 0
          fi

          : > "${RUNNER_TEMP}/additions.json"

          while IFS= read -r -d '' path; do
            base64 --wrap 0 "${path}" > "${RUNNER_TEMP}/contents.base64"

            jq --null-input \
              --arg path "${path}" \
              --rawfile contents "${RUNNER_TEMP}/contents.base64" \
              '{contents: $contents, path: $path}' >> "${RUNNER_TEMP}/additions.json"
          done < <(git diff --cached --name-only -z)

          jq --null-input \
            --arg head_ref "${HEAD_REF}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --slurpfile additions "${RUNNER_TEMP}/additions.json" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {branchName: $head_ref, repositoryNameWithOwner: $repository},
                  expectedHeadOid: $head_sha,
                  fileChanges: {additions: $additions},
                  message: {headline: "chore(deps): update nub lockfiles"}
                }
              }
            }' > "${RUNNER_TEMP}/nub-lock-commit.json"

          if gh api graphql --input "${RUNNER_TEMP}/nub-lock-commit.json"; then
            gh workflow run ci.yml --ref "${HEAD_REF}"
            exit 0
          fi

          current_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq '.object.sha')"

          if [ "${current_head_sha}" != "${HEAD_SHA}" ]; then
            echo 'The dependency branch changed; the next push regenerates the lockfiles.'
            exit 0
          fi

          exit 1

  update-generated-files:
    name: Update generated files

    if: github.event.review.state == 'approved' && github.event.pull_request.user.id == 29139614 && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      actions: write # Run CI for the generated files commit.
      contents: write # Commit generated files to the approved dependency branch.

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare composer dependencies
        uses: hosmelq/.github/.github/actions/composer-dependencies@32f4a95b53649f1634b195193a61bb56a6b26d50 # main
        with:
          artifact-mode: none
          php-tools: ''
          php-version: ${{ env.PHP_VERSION }}

      - name: Setup Nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          nub-version: ${{ env.NUB_VERSION }}

      - name: Update Laravel Boost guidelines
        env:
          APP_ENV: local
        run: php artisan boost:install --guidelines --skills --no-interaction

      - name: Update agent skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${HOME}/.codex"
          nubx -y skills@1.7.0 update --project --yes
          test ! -e agent/skills

      - name: Commit updated files
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add --all

          if git diff --cached --quiet; then
            exit 0
          fi

          : > "${RUNNER_TEMP}/additions.json"
          : > "${RUNNER_TEMP}/deletions.json"

          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            if [ "${status}" = 'D' ]; then
              jq --null-input --arg path "${path}" '{path: $path}' >> "${RUNNER_TEMP}/deletions.json"
              continue
            fi

            base64 --wrap 0 "${path}" > "${RUNNER_TEMP}/contents.base64"

            jq --null-input \
              --arg path "${path}" \
              --rawfile contents "${RUNNER_TEMP}/contents.base64" \
              '{contents: $contents, path: $path}' >> "${RUNNER_TEMP}/additions.json"
          done < <(git diff --cached --name-status --no-renames -z)

          jq --null-input \
            --arg head_ref "${HEAD_REF}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --slurpfile additions "${RUNNER_TEMP}/additions.json" \
            --slurpfile deletions "${RUNNER_TEMP}/deletions.json" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {branchName: $head_ref, repositoryNameWithOwner: $repository},
                  expectedHeadOid: $head_sha,
                  fileChanges: {additions: $additions, deletions: $deletions},
                  message: {headline: "chore(deps): update generated files"}
                }
              }
            }' > "${RUNNER_TEMP}/generated-files-commit.json"

          if gh api graphql --input "${RUNNER_TEMP}/generated-files-commit.json"; then
            gh workflow run ci.yml --ref "${HEAD_REF}"
            exit 0
          fi

          current_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq '.object.sha')"

          if [ "${current_head_sha}" != "${HEAD_SHA}" ]; then
            echo 'The dependency branch changed; approve the pull request again to regenerate its files.'
            exit 0
          fi

          exit 1
