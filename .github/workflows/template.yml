name: Template feature combinations

on:
  push:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'

jobs:
  test-template:
    name: Test template feature combinations

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare composer dependencies
        uses: hosmelq/.github/.github/actions/composer-dependencies@32f4a95b53649f1634b195193a61bb56a6b26d50
        with:
          artifact-mode: none
          php-tools: ''
          php-version: ${{ env.PHP_VERSION }}

      - name: Install trash CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes trash-cli

      - name: Test template feature combinations
        run: scripts/test-template-feature-combinations
