rules:
  forbidden-uses:
    config:
      allow:
        - actions/*
        - hosmelq/.github/*
        - jdx/mise-action
        - nubjs/setup-nub
        - pullfrog/pullfrog@v0
        - zizmorcore/zizmor-action
  unpinned-uses:
    config:
      policies:
        pullfrog/pullfrog: ref-pin
        '*': hash-pin
