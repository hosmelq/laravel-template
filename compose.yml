services:
  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - '127.0.0.1:${COMPOSE_MAIL_PORT:-0}:1025'
      - '127.0.0.1:${COMPOSE_MAILPIT_PORT:-0}:8025'

  postgresql:
    environment:
      POSTGRES_DB: template
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    healthcheck:
      interval: 10s
      retries: 5
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d template_testing']
      timeout: 5s
    image: postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    ports:
      - '127.0.0.1:${COMPOSE_DB_PORT:-0}:5432'
    volumes:
      - postgresql:/var/lib/postgresql
      - ./infrastructure/docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgresql:
