services:
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      - '127.0.0.1:${COMPOSE_MAIL_PORT:-0}:1025'
      - '127.0.0.1:${COMPOSE_MAILPIT_PORT:-0}:8025'

  postgresql:
    environment:
      POSTGRES_DB: template
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    healthcheck:
      interval: 10s
      retries: 5
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d template_testing']
      timeout: 5s
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    ports:
      - '127.0.0.1:${COMPOSE_DB_PORT:-0}:5432'
    volumes:
      - template-postgresql:/var/lib/postgresql
      - ./infrastructure/docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  template-postgresql:
